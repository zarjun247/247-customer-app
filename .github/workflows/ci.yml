name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@10.4.1 --activate

      - name: Verify pnpm
        run: pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check
        run: pnpm run check


  governance-security-scans:
    name: governance-security-scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@10.4.1 --activate

      - name: Verify pnpm
        run: pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Governance security scans
        run: node scripts/ci-governance-guards.mjs all

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@10.4.1 --activate

      - name: Verify pnpm
        run: pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test -- --runInBand

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@10.4.1 --activate

      - name: Verify pnpm
        run: pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build

  migration-smoke:
    name: migration-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@10.4.1 --activate

      - name: Verify pnpm
        run: pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Migration guard
        run: pnpm test -- server/migration-smoke.guard.test.ts --runInBand

  security-env-guards:
    name: security-env-guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@10.4.1 --activate

      - name: Verify pnpm
        run: pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Security guard suite
        run: pnpm test -- server/security-env.guard.test.ts server/worker-security.guard.test.ts server/storage-access.guard.test.ts server/auth-otp.guard.test.ts server/security-procedure.guard.test.ts --runInBand

  placeholder-guards:
    name: placeholder-guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@10.4.1 --activate

      - name: Verify pnpm
        run: pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Placeholder guard suite
        run: pnpm test -- server/placeholder-production.guard.test.ts --runInBand

  release-gate-advisory:
    name: release-gate-advisory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@10.4.1 --activate

      - name: Verify pnpm
        run: pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Migration verification
        run: pnpm run migrations:verify
      - name: Release gate (test mode)
        run: pnpm run release:gate -- --mode test

  mysql-db-lifecycle:
    name: mysql-db-lifecycle
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test_root_password
          MYSQL_DATABASE: 247_customer_app_test
          MYSQL_USER: 247_test_user
          MYSQL_PASSWORD: 247_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u247_test_user -p247_test_password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=20s
    env:
      TEST_DATABASE_URL: mysql://247_test_user:247_test_password@127.0.0.1:3306/247_customer_app_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@10.4.1 --activate

      - name: Verify pnpm
        run: pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Apply test DB migrations
        run: pnpm run test:db:bootstrap
      - name: Apply schema extension migrations (0050+)
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          node - <<'NODE_EOF'
          const mysql = require('mysql2/promise');
          const fs = require('fs');
          const path = require('path');
          const SKIP = new Set(['ER_TABLE_EXISTS_ERROR','ER_DUP_FIELDNAME','ER_DUP_KEYNAME','ER_CANT_DROP_FIELD_OR_KEY']);
          (async () => {
            const conn = await mysql.createConnection(process.env.DATABASE_URL);
            const files = fs.readdirSync('drizzle')
              .filter(f => {
                if (!f.endsWith('.sql')) return false;
                const m = f.match(/^(\d{4})_/);
                return m ? parseInt(m[1], 10) >= 50 : false;
              })
              .sort();
            for (const file of files) {
              const sql = fs.readFileSync(path.join('drizzle', file), 'utf8');
              const stmts = sql.split(/-->[ \t]*statement-breakpoint[ \t]*\r?\n|;[ \t]*(?:\r?\n|$)/)
                .map(s => s.replace(/--[^\n]*/g, '').trim())
                .filter(Boolean);
              for (const stmt of stmts) {
                try { await conn.query(stmt); console.log('ok:', file); }
                catch(e) {
                  if (SKIP.has(e.code)) { console.log('skip:', file, e.code); }
                  else if (e.code === 'ER_BAD_FIELD_ERROR' && /\bAFTER\b/i.test(stmt)) {
                    const stripped = stmt.replace(/\s+AFTER\s+`?\w+`?/i, '');
                    try {
                      await conn.query(stripped);
                      console.log('ok (stripped AFTER):', file);
                    } catch(e2) {
                      if (SKIP.has(e2.code)) console.log('skip:', file, e2.code);
                      else { console.error('FAIL:', file, e2.message); process.exitCode = 1; }
                    }
                  }
                  else { console.error('FAIL:', file, e.message); process.exitCode = 1; }
                }
              }
            }
            await conn.end();
          })().catch(e => { console.error(e); process.exit(1); });
          NODE_EOF
      - name: Apply column-level schema extensions
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: node scripts/migrate-v10.mjs
      - name: MySQL DB lifecycle smoke
        run: pnpm run test:db:smoke

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@10.4.1 --activate

      - name: Verify pnpm
        run: pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint (regression gate)
        run: pnpm run lint:ci

  audit:
    name: audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@10.4.1 --activate

      - name: Verify pnpm
        run: pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Audit (high severity advisory)
        run: pnpm audit --audit-level=moderate --prod
