name: Backup Drill
on:
  schedule:
    - cron: '0 3 * * 0'  # Sunday 03:00 UTC
  workflow_dispatch:
jobs:
  drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@10.4.1 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run backup drill
        run: pnpm run backup-drill
        env:
          BACKUP_DRILL_ENABLED: ${{ secrets.BACKUP_DRILL_ENABLED || 'false' }}
          # TBD: set via GitHub Secrets before enabling real drills
          # BACKUP_SOURCE_DB_URL: ${{ secrets.BACKUP_SOURCE_DB_URL }}
          # BACKUP_TARGET_DB_URL: ${{ secrets.BACKUP_TARGET_DB_URL }}
          # DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          NODE_ENV: staging
