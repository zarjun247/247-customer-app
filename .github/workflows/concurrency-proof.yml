name: Concurrency Proof

on:
  workflow_dispatch: {}

jobs:
  mysql-concurrency-proof:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: pass
          MYSQL_DATABASE: 247_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -P 3306 --silent; then
              echo "MySQL up" && break;
            fi
            echo "Waiting for MySQL..."; sleep 2;
          done
      - name: Set TEST_DATABASE_URL
        run: echo "TEST_DATABASE_URL=mysql://root:pass@127.0.0.1:3306/247_test" >> $GITHUB_ENV
      - name: Run DB concurrency tests
        run: pnpm run test:db:concurrency
