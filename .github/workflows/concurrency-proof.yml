name: DB Concurrency Proof

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mysql-concurrency-proof:
    name: mysql-concurrency-proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test_root_password
          MYSQL_DATABASE: 247_customer_app_test
          MYSQL_USER: 247_test_user
          MYSQL_PASSWORD: 247_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u247_test_user -p247_test_password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=20s
    env:
      TEST_DATABASE_URL: mysql://247_test_user:247_test_password@127.0.0.1:3306/247_customer_app_test
      CI_EVIDENCE_DIR: ci-evidence/db-concurrency
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@10.4.1 --activate

      - name: Verify pnpm
        run: pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Apply test DB migrations
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$CI_EVIDENCE_DIR"
          pnpm run test:db:bootstrap 2>&1 | tee "$CI_EVIDENCE_DIR/test-db-bootstrap.log"

      - name: Apply schema extension migrations (0050+)
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          node - <<'NODE_EOF'
          const mysql = require('mysql2/promise');
          const fs = require('fs');
          const path = require('path');
          const SKIP = new Set(['ER_TABLE_EXISTS_ERROR','ER_DUP_FIELDNAME','ER_DUP_KEYNAME','ER_CANT_DROP_FIELD_OR_KEY']);
          (async () => {
            const conn = await mysql.createConnection(process.env.DATABASE_URL);
            const files = fs.readdirSync('drizzle')
              .filter(f => {
                if (!f.endsWith('.sql')) return false;
                const m = f.match(/^(\d{4})_/);
                return m ? parseInt(m[1], 10) >= 50 : false;
              })
              .sort();
            for (const file of files) {
              const sql = fs.readFileSync(path.join('drizzle', file), 'utf8');
              const stmts = sql.split(/;[ \t]*(?:\r?\n|$)/)
                .map(s => s.replace(/--[^\n]*/g, '').trim())
                .filter(Boolean);
              for (const stmt of stmts) {
                try { await conn.query(stmt); console.log('ok:', file); }
                catch(e) {
                  if (SKIP.has(e.code)) console.log('skip:', file, e.code);
                  else { console.error('FAIL:', file, e.message); process.exitCode = 1; }
                }
              }
            }
            await conn.end();
          })().catch(e => { console.error(e); process.exit(1); });
          NODE_EOF

      - name: Apply column-level schema extensions
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: node scripts/migrate-v10.mjs

      - name: Run MySQL concurrency proof
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$CI_EVIDENCE_DIR"
          pnpm run test:db:concurrency 2>&1 | tee "$CI_EVIDENCE_DIR/mysql-concurrency-proof.log"

      - name: Write DB proof evidence manifest
        if: always()
        shell: bash
        run: |
          mkdir -p "$CI_EVIDENCE_DIR"
          {
            echo "# DB Concurrency Proof Evidence"
            echo ""
            echo "- workflow: ${GITHUB_WORKFLOW}"
            echo "- job: mysql-concurrency-proof"
            echo "- run_id: ${GITHUB_RUN_ID}"
            echo "- run_attempt: ${GITHUB_RUN_ATTEMPT}"
            echo "- ref: ${GITHUB_REF}"
            echo "- sha: ${GITHUB_SHA}"
            echo "- mysql_image: mysql:8.4"
            echo "- test_database_url_host: 127.0.0.1:3306/247_customer_app_test"
            echo "- migration_command: pnpm run test:db:bootstrap"
            echo "- concurrency_command: pnpm run test:db:concurrency"
            echo "- generated_at_utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "## Log checksums"
            sha256sum "$CI_EVIDENCE_DIR"/*.log 2>/dev/null || true
          } | tee "$CI_EVIDENCE_DIR/evidence-manifest.md"
          cat "$CI_EVIDENCE_DIR/evidence-manifest.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload DB proof evidence logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-concurrency-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence/db-concurrency
          if-no-files-found: warn
          retention-days: 30
