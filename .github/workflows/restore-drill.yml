name: Restore Drill
on:
  schedule:
    - cron: '0 4 1 * *'  # First of month, 04:00 UTC
  workflow_dispatch:
jobs:
  drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@10.4.1 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run restore drill
        run: pnpm run restore:drill
        env:
          # TBD: set via GitHub Secrets before enabling real drills
          # RESTORE_DATABASE_URL: ${{ secrets.RESTORE_DATABASE_URL }}
          # RESTORE_BACKUP_FILE: ${{ secrets.RESTORE_BACKUP_FILE_PATH }}
          NODE_ENV: staging
