services:
  mysql-test:
    image: mysql:8.4
    container_name: 247-customer-app-mysql-test
    environment:
      MYSQL_ROOT_PASSWORD: test_root_password
      MYSQL_DATABASE: 247_customer_app_test
      MYSQL_USER: 247_test_user
      MYSQL_PASSWORD: 247_test_password
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    tmpfs:
      - /var/lib/mysql
